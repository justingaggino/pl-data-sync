name: FPL nightly sync

on:
  schedule:
    # 01:30 UTC daily = 11:30am Brisbane. After UK price changes (23:00/00:00 UTC)
    # and after the latest possible UK evening match has finished.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fpl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snapshot sync
        run: python sync.py

      - name: Build digest
        run: python digest.py

      - name: Commit and push
        run: |
          git config user.name "pl-data-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
